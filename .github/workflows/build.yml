name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build plugin
        run: mvn -B -f plugin/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: DemonSlayer-plugin
          path: plugin/target/DemonSlayer-*.jar

  server-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: DemonSlayer-plugin
          path: plugin/target
      - name: Install test bot
        run: npm ci
        working-directory: test-bot
      - name: Start the server and run the test bot
        run: bash .github/scripts/server-test.sh
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server/server.log

  docker-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DemonSlayer-plugin
          path: server/plugins
      - name: Start with Docker Compose and check the plugin loads
        working-directory: server
        run: |
          EULA=TRUE docker compose up -d
          for i in $(seq 300); do
            if docker compose logs 2>&1 | grep -q 'Done ('; then break; fi
            sleep 2
          done
          docker compose logs 2>&1 | tail -n 60
          docker compose logs 2>&1 | grep -q 'Demon Slayer ready'
          docker compose down
